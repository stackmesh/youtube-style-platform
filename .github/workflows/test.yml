name: tests

on:
  push:
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest tests/unit -q --override-ini addopts=
        env:
          STORAGE_STARTUP_CHECK: "false"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private keys and live admin secrets
        run: |
          if git grep -nE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY|S3_ADMIN_SECRET_KEY=[^$].+' -- . ':!.env.example' ':!.env.seaweed-admin.example' ':!docs'; then
            echo "possible secret in the tree"
            exit 1
          fi
